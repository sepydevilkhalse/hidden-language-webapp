<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="زبان مخفی">
    <title>زبان مخفی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&amp;display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #1a1a3e, #16213e);
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', 'Noto Color Emoji', 'Segoe UI Emoji', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
        }

        body::-webkit-scrollbar {
            display: none;
        }
        body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            box-shadow: 0 0 4px rgba(255,255,255,0.2);
            will-change: transform, opacity;
        }
        @keyframes twinkle {
            0% { opacity: 0.15; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .floating-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .f-particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.05);
            animation: floatParticle var(--duration) ease-in-out infinite alternate;
            will-change: transform;
        }
        @keyframes floatParticle {
            0% { transform: translateY(0px) scale(1) rotate(0deg); }
            100% { transform: translateY(-20px) scale(1.05) rotate(8deg); }
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
            padding-top: 18px;
            position: relative;
            z-index: 1;
        }
        
        .glass-card {
            background: rgba(25, 20, 45, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 14px 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.12);
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            margin-bottom: 12px;
            position: relative;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 33px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(180, 130, 255, 0.1), rgba(160, 120, 255, 0.03), rgba(180, 130, 255, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: breatheGlow 4s ease-in-out infinite;
        }

        @keyframes breatheGlow {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.5; }
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            border-color: rgba(139, 92, 246, 0.18);
        }
        
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .time {
            font-size: 1rem;
            font-weight: bold;
            color: #c4b5fd;
            font-family: monospace;
            letter-spacing: 2px;
            background: rgba(139, 92, 246, 0.04);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(139, 92, 246, 0.06);
        }
        
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin: 6px 0 4px 0;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 700;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            animation: titleGlow 3s ease-in-out infinite;
        }
        
        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(139, 92, 246, 0.08), 0 0 20px rgba(139, 92, 246, 0.04); }
            50% { text-shadow: 0 0 20px rgba(139, 92, 246, 0.15), 0 0 40px rgba(139, 92, 246, 0.08); }
        }
        
        .sub {
            text-align: center;
            color: #a78bfa;
            margin-bottom: 18px;
            font-size: 0.65rem;
            border-bottom: 1px dashed rgba(139, 92, 246, 0.15);
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 5px;
            padding-left: 12px;
            padding-right: 12px;
        }
        
        .input-area {
            margin-bottom: 16px;
        }
        
        .input-area label {
            display: block;
            font-size: 0.6rem;
            color: #c4b5fd;
            margin-bottom: 6px;
            margin-right: 6px;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            opacity: 0.8;
        }
        
        textarea {
            width: 100%;
            background: rgba(15, 12, 30, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.12);
            border-radius: 22px;
            color: #f1f5f9;
            font-size: 0.95rem;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', 'Noto Color Emoji', 'Segoe UI Emoji', monospace;
            resize: none;
            outline: none;
            padding: 14px 16px;
            direction: rtl;
            min-height: 110px;
            height: auto;
            overflow-y: hidden;
            transition: border-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s cubic-bezier(0.22, 1, 0.36, 1), transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            line-height: 1.7;
            position: relative;
        }
        
        textarea::placeholder {
            color: #4a4a6a;
            font-size: 0.85rem;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
        }
        
        textarea:focus {
            border-color: rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.04);
            background: rgba(15, 12, 30, 0.7);
            transform: scale(1.005);
        }
        
        .result-area {
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            margin-top: 8px;
            padding: 10px 16px !important;
            position: relative;
            overflow: hidden;
        }
        
        .result-area::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.02) 0%, transparent 60%);
            animation: shimmer 6s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes shimmer {
            0%, 100% { transform: translate(-30%, -30%) scale(1); opacity: 0; }
            50% { transform: translate(30%, 30%) scale(1.5); opacity: 1; }
        }
        
        .result-area:active {
            transform: scale(0.97);
        }
        
        .result-label {
            font-size: 0.6rem;
            color: #c4b5fd;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            position: relative;
            z-index: 1;
        }
        
        .result-text {
            font-size: 0.95rem;
            word-wrap: break-word;
            line-height: 1.6;
            font-weight: 500;
            color: #f1f5f9;
            min-height: 28px;
            white-space: pre-wrap;
            transition: opacity 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            font-family: 'Apple Color Emoji', 'Noto Nastaliq Urdu', -apple-system, 'Noto Color Emoji', monospace;
            position: relative;
            z-index: 1;
        }
        
        .result-text[dir="rtl"] {
            text-align: right;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', monospace;
        }
        
        .result-text[dir="ltr"] {
            text-align: left;
            direction: ltr;
            font-family: 'Apple Color Emoji', 'Noto Color Emoji', 'Noto Nastaliq Urdu', monospace;
        }
        
        .copy-hint {
            font-size: 0.55rem;
            color: #6a6a8a;
            text-align: center;
            margin-top: 8px;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            animation: hintPulse 2.5s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }
        
        @keyframes hintPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .swap-hint {
            text-align: center;
            font-size: 0.6rem;
            color: #a78bfa;
            margin-top: 16px;
            background: rgba(30, 27, 46, 0.3);
            padding: 8px;
            border-radius: 24px;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            animation: pulseGlow 3s ease-in-out infinite;
            border: 1px solid rgba(139, 92, 246, 0.05);
            position: relative;
        }

        .swap-hint::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 25px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(180, 130, 255, 0.08), rgba(160, 120, 255, 0.03), rgba(180, 130, 255, 0.08));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: breatheGlow 4s ease-in-out infinite;
        }
        
        @keyframes pulseGlow {
            0%, 100% { background: rgba(30, 27, 46, 0.3); border-color: rgba(139, 92, 246, 0.05); }
            50% { background: rgba(30, 27, 46, 0.5); border-color: rgba(139, 92, 246, 0.12); }
        }

        .btn-clear-wrapper {
            margin-top: 12px;
            display: flex;
            justify-content: center;
        }
        .btn-clear {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 24px;
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-clear:active {
            transform: scale(0.96);
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 8px 18px;
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 24px;
            background: rgba(25, 20, 45, 0.3);
            color: #c4b5fd;
            font-size: 0.7rem;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            backdrop-filter: blur(4px);
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.06), transparent);
            transition: left 0.5s ease;
        }
        .btn:hover::before {
            left: 100%;
        }
        .btn:active {
            transform: scale(0.93);
        }
        .btn-primary {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(99, 102, 241, 0.08));
            border-color: rgba(139, 92, 246, 0.2);
        }

        /* ===== مودال ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            transition: 
                opacity 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                backdrop-filter 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                visibility 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 20px;
        }
        .modal-overlay.show {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .modal-box {
            background: rgba(25, 20, 45, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 28px 32px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(139, 92, 246, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            transform: translateY(20px) scale(0.92);
            opacity: 0;
            transition: 
                transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .modal-box::-webkit-scrollbar {
            display: none;
        }

        .modal-overlay.show .modal-box {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .modal-box::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 37px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(180, 130, 255, 0.1), rgba(160, 120, 255, 0.04), rgba(180, 130, 255, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: breatheGlow 4s ease-in-out infinite;
        }

        .modal-overlay.closing {
            transition: 
                opacity 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                backdrop-filter 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .modal-overlay.closing .modal-box {
            transform: translateY(20px) scale(0.92);
            opacity: 0;
            transition: 
                transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .modal-title {
            color: #c4b5fd;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 14px;
            text-align: center;
            border-bottom: 1px solid rgba(139, 92, 246, 0.08);
            padding-bottom: 12px;
        }
        .modal-body {
            color: #e2e8f0;
            font-size: 0.85rem;
            line-height: 1.9;
            text-align: center;
            white-space: pre-wrap;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            overflow-y: auto;
            max-height: 50vh;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .modal-body::-webkit-scrollbar {
            display: none;
        }
        
        .modal-close {
            position: absolute;
            top: 12px;
            right: 18px;
            background: none;
            border: none;
            color: #a78bfa;
            font-size: 1.3rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
        }
        .modal-close:active {
            transform: scale(0.88);
            color: #fff;
            background: rgba(139, 92, 246, 0.08);
        }

        /* ===== نوارهای اطلاع‌رسانی از بالا ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            width: 90%;
            max-width: 460px;
        }

        .toast {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            pointer-events: auto;
            transform: translateY(-20px) scale(0.92);
            opacity: 0;
            visibility: hidden;
            transition: 
                transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                visibility 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform, opacity;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .toast.hide {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-20px) scale(0.92);
        }

        .toast-success {
            background: rgba(16, 185, 129, 0.85);
            color: white;
            border-color: rgba(16, 185, 129, 0.2);
        }
        .toast-success .toast-icon {
            color: #6ee7b7;
        }

        .toast-error {
            background: rgba(220, 38, 38, 0.85);
            color: white;
            border-color: rgba(220, 38, 38, 0.2);
        }
        .toast-error .toast-icon {
            color: #fca5a5;
        }

        .toast-icon {
            font-size: 1.1rem;
            flex-shrink: 0;
            line-height: 1;
        }
        .toast-text {
            flex: 1;
            text-align: center;
            line-height: 1.4;
        }

        ::-webkit-scrollbar {
            display: none;
        }
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        @media (max-width: 480px) {
            .modal-box {
                padding: 20px 18px;
                border-radius: 28px;
            }
            .glass-card {
                padding: 12px 14px;
            }
            .f-particle {
                display: none;
            }
            .stars {
                opacity: 0.6;
            }
            .toast {
                padding: 10px 16px;
                font-size: 0.75rem;
            }
            .toast-container {
                top: 12px;
            }
        }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="floating-particles" id="floatingParticles"></div>

<!-- ===== مودال ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <button class="modal-close" id="modalCloseBtn" aria-label="بستن">✕</button>
        <div class="modal-title" id="modalTitle">عنوان</div>
        <div class="modal-body" id="modalBody">متن</div>
    </div>
</div>

<!-- ===== نوارهای اطلاع‌رسانی از بالا ===== -->
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="glass-card header">
        <div class="time" id="clock">--:--:--</div>
    </div>

    <div class="glass-card" style="margin-top: 0;">
        <h1>
            <span class="emoji">🤫</span> زبان مخفی <span class="emoji">🔐</span>
        </h1>
        <div style="text-align: center;"><span class="sub">تبدیل خودکار متن ⇄ کد</span></div>

        <div class="input-area">
            <label>📝 بنویس... (فقط حروف فارسی)</label>
            <textarea id="inputBox" rows="3" placeholder="مثال:&#10;سلام خوبی&#10;یا&#10;15_27_1_28•9_30_2_32"></textarea>
        </div>

        <div class="result-area glass-card" id="resultBox" style="padding: 12px 16px; margin: 0;">
            <div class="result-label">
                <span class="emoji">🔓</span> نتیجه
            </div>
            <div id="outputText" class="result-text" dir="rtl">—</div>
            <div class="copy-hint">👇 برای کپی، روی نتیجه ضربه بزنید 👇</div>
        </div>

        <div class="btn-clear-wrapper">
            <button class="btn-clear" onclick="clearAll()">
                <span>✕</span> پاکسازی
            </button>
        </div>

        <div class="swap-hint">
            ✨ هوشمند | متن فارسی ←→ کد ✨
        </div>
    </div>

    <div class="glass-card" style="padding: 12px 16px;">
        <div class="btn-row">
            <button class="btn btn-primary" onclick="showAbout()">ℹ️ درباره</button>
            <button class="btn btn-primary" onclick="showStats()">📊 آمار من</button>
            <button class="btn btn-primary" onclick="showHistory()">📜 تاریخچه</button>
        </div>
    </div>
</div>

<script>
// ==============================================
// دیکشنری‌ها
// ==============================================
const letterToNum = {
    'ا': '1', 'آ': '1', 'ب': '2', 'پ': '3', 'ت': '4', 'ث': '5',
    'ج': '6', 'چ': '7', 'ح': '8', 'خ': '9', 'د': '10', 'ذ': '11',
    'ر': '12', 'ز': '13', 'ژ': '14', 'س': '15', 'ش': '16', 'ص': '17',
    'ض': '18', 'ط': '19', 'ظ': '20', 'ع': '21', 'غ': '22', 'ف': '23',
    'ق': '24', 'ک': '25', 'گ': '26', 'ل': '27', 'م': '28', 'ن': '29',
    'و': '30', 'ه': '31', 'ی': '32'
};

const numToLetter = {};
for (let key in letterToNum) {
    let val = letterToNum[key];
    if (val === '1') {
        numToLetter[val] = 'ا';
    } else if (!numToLetter[val]) {
        numToLetter[val] = key;
    }
}

const numberToGreek = {
    '0': 'ο', '1': 'α', '2': 'β', '3': 'γ', '4': 'δ',
    '5': 'ε', '6': 'π', '7': 'ζ', '8': 'η', '9': 'θ'
};

const greekToNum = {
    'ο': '0', 'α': '1', 'β': '2', 'γ': '3', 'δ': '4',
    'ε': '5', 'π': '6', 'ζ': '7', 'η': '8', 'θ': '9'
};

const VALID_GREEK = new Set(Object.keys(greekToNum));

// ==============================================
// تبدیل‌ها
// ==============================================
function p2e(str) {
    const map = { '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9' };
    return str.replace(/[۰-۹]/g, m => map[m]);
}

function cleanText(text) {
    if (!text) return text;
    text = text.replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/ة/g, 'ه');
    text = text.replace(/ـ/g, '');
    text = text.replace(/[\u200c\u200d\u200b\u2060\ufeff]/g, '');
    text = text.replace(/[\u200e\u200f\u202a\u202b\u202c\u202d\u202e]/g, '');
    text = text.replace(/\t/g, ' ');
    text = text.replace(/ +/g, ' ');
    text = text.trim();
    text = p2e(text);
    return text;
}

function htmlEscape(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ==============================================
// اعتبارسنجی
// ==============================================
function validateCode(text) {
    let errors = [];
    if ((text.match(/\|/g) || []).length % 2 !== 0) {
        errors.push("❌ تعداد | باید زوج باشد");
    }
    if (text.includes('||')) {
        errors.push("❌ | خالی مجاز نیست");
    }
    if (text.includes('__')) {
        errors.push("❌ __ مجاز نیست");
    }
    if (text.startsWith('_') || text.endsWith('_')) {
        errors.push("❌ _ در ابتدا یا انتها مجاز نیست");
    }
    if (text.includes('••')) {
        errors.push("❌ •• مجاز نیست");
    }
    let inBracket = false;
    let bracketContent = "";
    for (let ch of text) {
        if (ch === '|') {
            if (inBracket) {
                let tokens = bracketContent.split('_');
                for (let token of tokens) {
                    if (token && !VALID_GREEK.has(token)) {
                        errors.push(`❌ کاراکتر نامعتبر در |: ${token}`);
                    }
                }
                bracketContent = "";
                inBracket = false;
            } else {
                inBracket = true;
                bracketContent = "";
            }
        } else if (inBracket) {
            bracketContent += ch;
        }
    }
    let outsideBracket = text.replace(/\|[^|]*\|/g, '');
    let nums = outsideBracket.match(/\d+/g) || [];
    for (let num of nums) {
        if (parseInt(num) > 32) {
            errors.push(`❌ عدد ${num} معتبر نیست (بزرگتر از ۳۲)`);
        }
    }
    return errors;
}

// ==============================================
// Tokenizer
// ==============================================
function tokenize(text) {
    let tokens = [];
    let i = 0;
    const emojiRegex = /[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}]/u;
    
    while (i < text.length) {
        let match = text.substring(i).match(emojiRegex);
        if (match && match.index === 0) {
            tokens.push(['EMOJI', match[0]]);
            i += match[0].length;
            continue;
        }
        if (text[i] >= '0' && text[i] <= '9') {
            let num = '';
            while (i < text.length && text[i] >= '0' && text[i] <= '9') {
                num += text[i];
                i++;
            }
            tokens.push(['NUMBER', num]);
            continue;
        }
        if (letterToNum[text[i]] || text[i] === 'آ') {
            tokens.push(['PERSIAN', text[i]]);
            i++;
            continue;
        }
        if (['•', '|', '_', ' '].includes(text[i])) {
            tokens.push(['SEPARATOR', text[i]]);
            i++;
            continue;
        }
        tokens.push(['OTHER', text[i]]);
        i++;
    }
    return tokens;
}

function convertNumberToGreek(numStr) {
    let result = [];
    for (let ch of numStr) {
        if (ch >= '0' && ch <= '9') {
            result.push(numberToGreek[ch] || ch);
        } else {
            result.push(ch);
        }
    }
    return result.join('_');
}

// ==============================================
// Encode
// ==============================================
function encode(text) {
    try {
        text = cleanText(text);
        let lines = text.split('\n');
        let resultLines = [];
        
        for (let line of lines) {
            if (!line.trim()) {
                resultLines.push('');
                continue;
            }
            let tokens = tokenize(line);
            let outputParts = [];
            let currentPart = [];
            let greekBuffer = [];
            
            for (let [tokenType, tokenValue] of tokens) {
                if (tokenType === 'PERSIAN') {
                    if (greekBuffer.length > 0) {
                        currentPart.push('|' + greekBuffer.join('_') + '|');
                        greekBuffer = [];
                    }
                    currentPart.push(letterToNum[tokenValue]);
                } else if (tokenType === 'NUMBER') {
                    greekBuffer.push(convertNumberToGreek(tokenValue));
                } else if (tokenType === 'SEPARATOR') {
                    if (tokenValue === ' ') {
                        if (greekBuffer.length > 0) {
                            currentPart.push('|' + greekBuffer.join('_') + '|');
                            greekBuffer = [];
                        }
                        if (currentPart.length > 0) {
                            outputParts.push(currentPart.join('_'));
                            currentPart = [];
                        }
                        outputParts.push('•');
                    } else {
                        if (greekBuffer.length > 0) {
                            currentPart.push('|' + greekBuffer.join('_') + '|');
                            greekBuffer = [];
                        }
                        if (currentPart.length > 0) {
                            outputParts.push(currentPart.join('_'));
                            currentPart = [];
                        }
                        outputParts.push(tokenValue);
                    }
                } else if (tokenType === 'EMOJI') {
                    if (greekBuffer.length > 0) {
                        currentPart.push('|' + greekBuffer.join('_') + '|');
                        greekBuffer = [];
                    }
                    if (currentPart.length > 0) {
                        outputParts.push(currentPart.join('_'));
                        currentPart = [];
                    }
                    outputParts.push(tokenValue);
                } else {
                    if (greekBuffer.length > 0) {
                        currentPart.push('|' + greekBuffer.join('_') + '|');
                        greekBuffer = [];
                    }
                    if (currentPart.length > 0) {
                        outputParts.push(currentPart.join('_'));
                        currentPart = [];
                    }
                    outputParts.push(tokenValue);
                }
            }
            if (greekBuffer.length > 0) {
                currentPart.push('|' + greekBuffer.join('_') + '|');
                greekBuffer = [];
            }
            if (currentPart.length > 0) {
                outputParts.push(currentPart.join('_'));
            }
            resultLines.push(outputParts.join(''));
        }
        return htmlEscape(resultLines.join('\n'));
    } catch (e) {
        console.error('Encode error:', e);
        return '';
    }
}

// ==============================================
// Decode
// ==============================================
function decode(text) {
    try {
        text = cleanText(text);
        let errors = validateCode(text);
        if (errors.length > 0) {
            return '';
        }
        let lines = text.split('\n');
        let finalLines = [];
        
        for (let line of lines) {
            if (!line.trim()) {
                finalLines.push('');
                continue;
            }
            let tokens = tokenize(line);
            let resultWords = [];
            let currentWord = '';
            let inBracket = false;
            let bracketContent = '';
            
            for (let [tokenType, tokenValue] of tokens) {
                if (tokenType === 'SEPARATOR' && tokenValue === '|') {
                    if (inBracket) {
                        inBracket = false;
                        let greekTokens = bracketContent.split('_');
                        for (let gt of greekTokens) {
                            if (greekToNum[gt] !== undefined) {
                                currentWord += greekToNum[gt];
                            } else {
                                return '';
                            }
                        }
                        bracketContent = '';
                    } else {
                        inBracket = true;
                        bracketContent = '';
                    }
                    continue;
                }
                if (inBracket) {
                    bracketContent += tokenValue;
                    continue;
                }
                if (tokenType === 'NUMBER') {
                    let num = parseInt(tokenValue);
                    if (num > 32) {
                        return '';
                    }
                    if (numToLetter[tokenValue]) {
                        currentWord += numToLetter[tokenValue];
                    } else {
                        currentWord += tokenValue;
                    }
                } else if (tokenType === 'SEPARATOR') {
                    if (tokenValue === '•') {
                        if (currentWord) {
                            resultWords.push(currentWord);
                            currentWord = '';
                        }
                    }
                } else if (tokenType === 'EMOJI') {
                    if (currentWord) {
                        resultWords.push(currentWord);
                        currentWord = '';
                    }
                    resultWords.push(tokenValue);
                } else if (tokenType === 'PERSIAN') {
                    currentWord += tokenValue;
                } else {
                    if (currentWord) {
                        resultWords.push(currentWord);
                        currentWord = '';
                    }
                    resultWords.push(tokenValue);
                }
            }
            if (currentWord) {
                resultWords.push(currentWord);
            }
            finalLines.push(resultWords.join(' '));
        }
        return htmlEscape(finalLines.join('\n'));
    } catch (e) {
        console.error('Decode error:', e);
        return '';
    }
}

// ==============================================
// تشخیص خودکار
// ==============================================
function detectConversionType(text) {
    text = cleanText(text);
    if (/[ا-ی]/.test(text)) {
        return 'encode';
    }
    if (/^[0-9_•|α-ωοπϛΑ-ΩΟϚ]+$/.test(text)) {
        return 'decode';
    }
    if (/[α-ωοπϛ]/.test(text) || /[Α-ΩΟϚ]/.test(text)) {
        return 'decode';
    }
    if (text.includes('•') || text.includes('|')) {
        return 'decode';
    }
    if (text.includes('_') && /\d/.test(text)) {
        return 'decode';
    }
    return 'encode';
}

// ==============================================
// ستاره‌ها
// ==============================================
function createStars() {
    const container = document.getElementById('stars');
    const count = 80;
    for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2.5 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
        star.style.animationDelay = (Math.random() * 5) + 's';
        container.appendChild(star);
    }
}
createStars();

function createFloatingParticles() {
    const container = document.getElementById('floatingParticles');
    const count = 8;
    for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'f-particle';
        const size = Math.random() * 80 + 40;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.setProperty('--duration', (Math.random() * 6 + 5) + 's');
        p.style.animationDelay = (Math.random() * 4) + 's';
        p.style.opacity = Math.random() * 0.06 + 0.02;
        container.appendChild(p);
    }
}
createFloatingParticles();

// ==============================================
// ===== مودال =====
// ==============================================
let isModalOpen = false;
let modalCloseTimer = null;

function showModal(title, body) {
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').textContent = body;
    
    overlay.classList.remove('closing');
    
    requestAnimationFrame(() => {
        overlay.classList.add('show');
        isModalOpen = true;
        document.body.style.overflow = 'hidden';
    });
}

function closeModal() {
    const overlay = document.getElementById('modalOverlay');
    
    if (overlay.classList.contains('closing')) return;
    
    overlay.classList.add('closing');
    
    if (modalCloseTimer) clearTimeout(modalCloseTimer);
    modalCloseTimer = setTimeout(() => {
        overlay.classList.remove('show', 'closing');
        isModalOpen = false;
        document.body.style.overflow = '';
        modalCloseTimer = null;
    }, 300);
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this && isModalOpen) {
        closeModal();
    }
});

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && isModalOpen) {
        closeModal();
    }
});

// ==============================================
// ===== نوارهای اطلاع‌رسانی از بالا =====
// ==============================================
let toastTimeout = null;

function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    
    // حذف toast قبلی
    const existingToast = container.querySelector('.toast');
    if (existingToast) {
        existingToast.classList.add('hide');
        setTimeout(() => {
            if (existingToast.parentNode) {
                existingToast.remove();
            }
            createAndShowToast(message, type);
        }, 300);
    } else {
        createAndShowToast(message, type);
    }
}

function createAndShowToast(message, type) {
    const container = document.getElementById('toastContainer');
    
    const icon = type === 'success' ? '✅' : '❌';
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `
        <span class="toast-icon">${icon}</span>
        <span class="toast-text">${message}</span>
        <span class="toast-icon">${icon}</span>
    `;
    
    container.appendChild(toast);
    
    // نمایش با انیمیشن
    requestAnimationFrame(() => {
        toast.classList.add('show');
    });
    
    // مخفی کردن بعد از 2.5 ثانیه
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
        toast.classList.add('hide');
        setTimeout(() => {
            if (toast.parentNode) {
                toast.remove();
            }
            toastTimeout = null;
        }, 300);
    }, 2500);
}

// ==============================================
// دکمه پاکسازی
// ==============================================
function clearAll() {
    const inputBox = document.getElementById('inputBox');
    const outputDiv = document.getElementById('outputText');
    
    const hasInput = inputBox.value.trim() !== '';
    const hasOutput = outputDiv.innerText !== '—' && outputDiv.innerText.trim() !== '';
    
    if (!hasInput && !hasOutput) {
        showToast('❌ چیزی برای پاکسازی نیست', 'error');
        return;
    }
    
    inputBox.value = '';
    outputDiv.innerText = '—';
    outputDiv.setAttribute('data-error', 'false');
    outputDiv.setAttribute('dir', 'rtl');
    
    showToast('✅ پاکسازی تکمیل شد', 'success');
}

// ==============================================
// دکمه‌ها
// ==============================================
function showAbout() {
    showModal('ℹ️ درباره ربات', 
`🤖 نسخه: 3.3.4
📅 1404/11/25

✅ تبدیل فارسی ↔ کد مخفی
✅ تشخیص خودکار
✅ پشتیبانی از اعداد یونانی
✅ تاریخچه و آمار`);
}

let conversionCount = 0;
let historyLog = '';

function showStats() {
    showModal('📊 آمار من', 
`📝 تعداد تبدیل‌ها: ${conversionCount}
📆 تاریخ عضویت: ۱۴۰۰/۰۳/۲۴`);
}

function showHistory() {
    if (conversionCount === 0) {
        showModal('📜 تاریخچه', '📜 هنوز تبدیلی انجام ندادید!');
        return;
    }
    showModal('📜 تاریخچه', 
`📌 آخرین تبدیل‌ها:

${historyLog || 'هنوز تبدیلی انجام ندادید!'}`);
}

// ==============================================
// قلب‌ها و ساعت
// ==============================================
function dropHearts() {
    for (let i = 0; i < 6; i++) {
        setTimeout(() => {
            const heart = document.createElement('div');
            heart.className = 'heart-drop';
            heart.innerHTML = ['💕', '❤️', '💖', '💗', '💜', '✨'][Math.floor(Math.random() * 6)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = Math.random() * 2 + 2 + 's';
            heart.style.fontSize = Math.random() * 16 + 12 + 'px';
            heart.style.opacity = Math.random() * 0.4 + 0.3;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 3500);
        }, i * 60);
    }
}

function startClock() {
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;
        if (hours === minutes && minutes !== '00' && seconds === '00') {
            dropHearts();
        }
    }
    updateClock();
    setInterval(updateClock, 1000);
}
startClock();

// ==============================================
// رویدادها
// ==============================================
const inputBox = document.getElementById('inputBox');
const outputDiv = document.getElementById('outputText');
const resultBox = document.getElementById('resultBox');
let lastValue = '';
let lastResult = '';
let debounceTimer;

function vibrate() {
    if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(30);
    }
}

function update() {
    let rawText = inputBox.value;
    
    if (/[a-zA-Z]/.test(rawText) && !/[a-zA-Z]/.test(lastValue)) {
        showToast('❌ فقط حروف فارسی مجاز است', 'error');
        let newText = rawText.replace(/[a-zA-Z]/g, '');
        inputBox.value = newText;
        rawText = newText;
        inputBox.blur();
        vibrate();
        return;
    }
    
    lastValue = inputBox.value;
    
    if (rawText === '') {
        outputDiv.innerText = '—';
        outputDiv.setAttribute('data-error', 'false');
        outputDiv.setAttribute('dir', 'rtl');
        return;
    }
    
    let convType = detectConversionType(rawText);
    let result;
    
    if (convType === 'encode') {
        result = encode(rawText);
    } else {
        result = decode(rawText);
    }
    
    if (result !== lastResult && result !== '—' && result !== '' && !result.includes('❌')) {
        conversionCount++;
        let short = result.length > 30 ? result.slice(0, 30) + '...' : result;
        historyLog = `${conversionCount}. ${short}\n` + (historyLog || '').split('\n').slice(0, 4).join('\n');
        lastResult = result;
    }
    
    if (result === '' || result.includes('❌')) {
        outputDiv.innerText = '—';
        outputDiv.setAttribute('data-error', 'true');
        outputDiv.setAttribute('dir', 'rtl');
        // نمایش خطا فقط در نوار
        const errorMsg = result.includes('❌') ? result.replace(/❌/g, '').trim() : 'خطا در تبدیل';
        showToast(`❌ ${errorMsg}`, 'error');
        return;
    }
    
    outputDiv.innerText = result;
    outputDiv.setAttribute('dir', 'ltr');
    outputDiv.setAttribute('data-error', 'false');
}

inputBox.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(update, 200);
});

resultBox.addEventListener('click', async function(e) {
    e.stopPropagation();
    let txt = outputDiv.innerText;
    let isErr = outputDiv.getAttribute('data-error') === 'true';
    
    if (!txt || txt === '—' || isErr || txt.includes('❌') || txt === '') {
        showToast('❌ چیزی برای کپی نیست', 'error');
        vibrate();
        return;
    }
    
    inputBox.blur();
    
    try {
        await navigator.clipboard.writeText(txt);
        showToast('✅ کپی شد', 'success');
        resultBox.style.transform = 'scale(0.97)';
        setTimeout(() => resultBox.style.transform = '', 150);
        vibrate();
    } catch (err) {
        try {
            const textarea = document.createElement('textarea');
            textarea.value = txt;
            textarea.style.position = 'fixed';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('✅ کپی شد', 'success');
            resultBox.style.transform = 'scale(0.97)';
            setTimeout(() => resultBox.style.transform = '', 150);
            vibrate();
        } catch (err2) {
            showToast('❌ کپی نشد', 'error');
            vibrate();
        }
    }
});

inputBox.value = '';
update();

function autoResizeTextarea() {
    inputBox.style.height = 'auto';
    let newHeight = Math.min(inputBox.scrollHeight, 180);
    inputBox.style.height = newHeight + 'px';
}
inputBox.addEventListener('input', autoResizeTextarea);
autoResizeTextarea();
</script>
