<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="زبان مخفی">
    <title>زبان مخفی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&amp;display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #1a1a3e, #16213e);
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', 'Noto Color Emoji', 'Segoe UI Emoji', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            box-shadow: 0 0 6px rgba(255,255,255,0.3);
            will-change: transform, opacity;
        }
        @keyframes twinkle {
            0% { opacity: 0.15; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        .floating-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .f-particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.06);
            animation: floatParticle var(--duration) ease-in-out infinite alternate;
            will-change: transform;
        }
        @keyframes floatParticle {
            0% { transform: translateY(0px) scale(1) rotate(0deg); }
            100% { transform: translateY(-25px) scale(1.05) rotate(10deg); }
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
            padding-top: 18px;
            position: relative;
            z-index: 1;
        }
        
        .glass-card {
            background: rgba(25, 20, 45, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 14px 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255,255,255,0.03);
            border: 1px solid rgba(139, 92, 246, 0.15);
            transition: all 0.3s ease;
            margin-bottom: 12px;
            position: relative;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 33px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(180, 130, 255, 0.12), rgba(160, 120, 255, 0.04), rgba(180, 130, 255, 0.12));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: breatheGlow 4s ease-in-out infinite;
        }

        @keyframes breatheGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.3), 0 0 30px rgba(139, 92, 246, 0.04);
            border-color: rgba(139, 92, 246, 0.2);
        }
        
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .time {
            font-size: 1rem;
            font-weight: bold;
            color: #c4b5fd;
            font-family: monospace;
            letter-spacing: 2px;
            background: rgba(139, 92, 246, 0.05);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(139, 92, 246, 0.08);
        }
        
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin: 6px 0 4px 0;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 700;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            animation: titleGlow 3s ease-in-out infinite;
        }
        
        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(139, 92, 246, 0.1), 0 0 20px rgba(139, 92, 246, 0.05); }
            50% { text-shadow: 0 0 20px rgba(139, 92, 246, 0.2), 0 0 40px rgba(139, 92, 246, 0.1); }
        }
        
        .sub {
            text-align: center;
            color: #a78bfa;
            margin-bottom: 18px;
            font-size: 0.65rem;
            border-bottom: 1px dashed rgba(139, 92, 246, 0.2);
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 5px;
            padding-left: 12px;
            padding-right: 12px;
        }
        
        .input-area {
            margin-bottom: 16px;
        }
        
        .input-area label {
            display: block;
            font-size: 0.6rem;
            color: #c4b5fd;
            margin-bottom: 6px;
            margin-right: 6px;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            opacity: 0.8;
        }
        
        textarea {
            width: 100%;
            background: rgba(15, 12, 30, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 22px;
            color: #f1f5f9;
            font-size: 0.95rem;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', 'Noto Color Emoji', 'Segoe UI Emoji', monospace;
            resize: none;
            outline: none;
            padding: 14px 16px;
            direction: rtl;
            min-height: 110px;
            height: auto;
            overflow-y: hidden;
            transition: all 0.3s ease;
            line-height: 1.7;
            position: relative;
        }
        
        textarea:focus {
            border-color: rgba(139, 92, 246, 0.35);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.05), inset 0 0 20px rgba(139, 92, 246, 0.02);
            background: rgba(15, 12, 30, 0.7);
        }
        
        textarea::placeholder {
            color: #4a4a6a;
            font-size: 0.85rem;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
        }
        
        .result-area {
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            padding: 10px 16px !important;
            position: relative;
            overflow: hidden;
        }
        
        .result-area::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.02) 0%, transparent 60%);
            animation: shimmer 6s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes shimmer {
            0%, 100% { transform: translate(-30%, -30%) scale(1); opacity: 0; }
            50% { transform: translate(30%, 30%) scale(1.5); opacity: 1; }
        }
        
        .result-area:active {
            transform: scale(0.97);
        }
        
        .result-label {
            font-size: 0.6rem;
            color: #c4b5fd;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            position: relative;
            z-index: 1;
        }
        
        .result-text {
            font-size: 0.95rem;
            word-wrap: break-word;
            line-height: 1.6;
            font-weight: 500;
            color: #f1f5f9;
            min-height: 28px;
            white-space: pre-wrap;
            transition: all 0.3s ease;
            font-family: 'Apple Color Emoji', 'Noto Nastaliq Urdu', -apple-system, 'Noto Color Emoji', monospace;
            position: relative;
            z-index: 1;
        }
        
        .result-text[dir="rtl"] {
            text-align: right;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', monospace;
        }
        
        .result-text[dir="ltr"] {
            text-align: left;
            direction: ltr;
            font-family: 'Apple Color Emoji', 'Noto Color Emoji', 'Noto Nastaliq Urdu', monospace;
        }
        
        .copy-hint {
            font-size: 0.55rem;
            color: #6a6a8a;
            text-align: center;
            margin-top: 8px;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            animation: hintPulse 2.5s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }
        
        @keyframes hintPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .swap-hint {
            text-align: center;
            font-size: 0.6rem;
            color: #a78bfa;
            margin-top: 16px;
            background: rgba(30, 27, 46, 0.3);
            padding: 8px;
            border-radius: 24px;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            animation: pulseGlow 3s ease-in-out infinite;
            border: 1px solid rgba(139, 92, 246, 0.06);
            position: relative;
        }

        .swap-hint::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 25px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(180, 130, 255, 0.1), rgba(160, 120, 255, 0.03), rgba(180, 130, 255, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: breatheGlow 4s ease-in-out infinite;
        }
        
        @keyframes pulseGlow {
            0%, 100% { background: rgba(30, 27, 46, 0.3); border-color: rgba(139, 92, 246, 0.06); }
            50% { background: rgba(30, 27, 46, 0.5); border-color: rgba(139, 92, 246, 0.15); }
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 8px 18px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 24px;
            background: rgba(25, 20, 45, 0.3);
            color: #c4b5fd;
            font-size: 0.7rem;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.08), transparent);
            transition: all 0.5s ease;
        }
        .btn:hover::before {
            left: 100%;
        }
        .btn:hover {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.1);
        }
        .btn:active {
            transform: scale(0.93);
        }
        .btn-primary {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(99, 102, 241, 0.1));
            border-color: rgba(139, 92, 246, 0.25);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(99, 102, 241, 0.2));
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: rgba(25, 20, 45, 0.8);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 36px;
            padding: 28px 32px;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(139, 92, 246, 0.2);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 60px rgba(139, 92, 246, 0.03);
            animation: modalPop 0.3s ease both;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-box::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 37px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(180, 130, 255, 0.12), rgba(160, 120, 255, 0.04), rgba(180, 130, 255, 0.12));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: breatheGlow 4s ease-in-out infinite;
        }
        @keyframes modalPop {
            from { transform: scale(0.92) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .modal-title {
            color: #c4b5fd;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 14px;
            text-align: center;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
            padding-bottom: 12px;
        }
        .modal-body {
            color: #e2e8f0;
            font-size: 0.85rem;
            line-height: 1.9;
            text-align: center;
            white-space: pre-wrap;
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 18px;
            background: none;
            border: none;
            color: #a78bfa;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .modal-close:hover {
            transform: rotate(90deg);
            color: #fff;
            background: rgba(139, 92, 246, 0.1);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: toastFly 2.5s ease forwards;
            pointer-events: none;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            font-family: 'Noto Nastaliq Urdu', -apple-system, 'Apple Color Emoji', sans-serif;
        }
        
        @keyframes toastFly {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.95); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.95); visibility: hidden; }
        }
        
        .toast-success {
            background: rgba(16, 185, 129, 0.85);
            color: white;
        }
        
        .toast-error {
            background: rgba(220, 38, 38, 0.85);
            color: white;
        }
        
        .shake {
            animation: shakeAnim 0.3s ease-in-out;
        }
        
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        
        .heart-drop {
            position: fixed;
            top: -30px;
            pointer-events: none;
            z-index: 9999;
            animation: drop linear forwards;
            font-family: 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.2));
        }
        
        @keyframes drop {
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
        
        .emoji {
            display: inline-block;
            animation: emojiPop 0.3s ease-out;
            font-family: 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        }
        
        @keyframes emojiPop {
            from { transform: scale(0.7) rotate(-10deg); opacity: 0; }
            to { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 8, 28, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            .modal-box {
                padding: 20px 18px;
                border-radius: 28px;
            }
            .glass-card {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="floating-particles" id="floatingParticles"></div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-title" id="modalTitle">عنوان</div>
        <div class="modal-body" id="modalBody">متن</div>
    </div>
</div>

<div class="container">
    <div class="glass-card header">
        <div class="time" id="clock">--:--:--</div>
    </div>

    <div class="glass-card" style="margin-top: 0;">
        <h1>
            <span class="emoji">🤫</span> زبان مخفی <span class="emoji">🔐</span>
        </h1>
        <div style="text-align: center;"><span class="sub">تبدیل خودکار متن ⇄ کد</span></div>

        <div class="input-area">
            <label>📝 بنویس... (فقط حروف فارسی)</label>
            <textarea id="inputBox" rows="3" placeholder="مثال:&#10;سلام ۱۲۳ خوبی&#10;یا&#10;15_27_1_28•|α_β_γ|•9_30_2_32"></textarea>
        </div>

        <div class="result-area glass-card" id="resultBox" style="padding: 12px 16px; margin: 0;">
            <div class="result-label">
                <span class="emoji">🔓</span> نتیجه
            </div>
            <div id="outputText" class="result-text" dir="rtl">—</div>
            <div class="copy-hint">👇 برای کپی، روی نتیجه ضربه بزنید 👇</div>
        </div>

        <div class="swap-hint">
            ✨ هوشمند | متن فارسی ←→ کد ✨
        </div>
    </div>

    <div class="glass-card" style="padding: 12px 16px;">
        <div class="btn-row">
            <button class="btn btn-primary" onclick="showAbout()">ℹ️ درباره</button>
            <button class="btn btn-primary" onclick="showStats()">📊 آمار من</button>
            <button class="btn btn-primary" onclick="showHistory()">📜 تاریخچه</button>
        </div>
    </div>
</div>

<script>
// ==============================================
// دیکشنری‌ها (دقیقاً برابر با ربات)
// ==============================================
const letterToNum = {
    'ا': '1', 'آ': '1', 'ب': '2', 'پ': '3', 'ت': '4', 'ث': '5',
    'ج': '6', 'چ': '7', 'ح': '8', 'خ': '9', 'د': '10', 'ذ': '11',
    'ر': '12', 'ز': '13', 'ژ': '14', 'س': '15', 'ش': '16', 'ص': '17',
    'ض': '18', 'ط': '19', 'ظ': '20', 'ع': '21', 'غ': '22', 'ف': '23',
    'ق': '24', 'ک': '25', 'گ': '26', 'ل': '27', 'م': '28', 'ن': '29',
    'و': '30', 'ه': '31', 'ی': '32'
};

const numToLetter = {};
for (let key in letterToNum) {
    let val = letterToNum[key];
    if (val === '1') {
        numToLetter[val] = 'ا';
    } else if (!numToLetter[val]) {
        numToLetter[val] = key;
    }
}

// عدد ۶ به π (مثل ربات)
const numberToGreek = {
    '0': 'ο', '1': 'α', '2': 'β', '3': 'γ', '4': 'δ',
    '5': 'ε', '6': 'π', '7': 'ζ', '8': 'η', '9': 'θ'
};

const greekToNum = {
    'ο': '0', 'α': '1', 'β': '2', 'γ': '3', 'δ': '4',
    'ε': '5', 'π': '6', 'ζ': '7', 'η': '8', 'θ': '9'
};

const VALID_GREEK = new Set(Object.keys(greekToNum));

// ==============================================
// تبدیل‌ها و پاکسازی (clean_text مثل ربات)
// ==============================================
function p2e(str) {
    const map = { '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9' };
    return str.replace(/[۰-۹]/g, m => map[m]);
}

function cleanText(text) {
    if (!text) return text;
    
    // تبدیل عربی به فارسی
    text = text.replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/ة/g, 'ه');
    
    // حذف کشیده
    text = text.replace(/ـ/g, '');
    
    // حذف Zero Width
    text = text.replace(/[\u200c\u200d\u200b\u2060\ufeff]/g, '');
    
    // حذف RTL/LTR Marks
    text = text.replace(/[\u200e\u200f\u202a\u202b\u202c\u202d\u202e]/g, '');
    
    // تبدیل تب به فاصله
    text = text.replace(/\t/g, ' ');
    
    // تبدیل چند فاصله به یکی
    text = text.replace(/ +/g, ' ');
    
    // حذف فاصله اول و آخر
    text = text.trim();
    
    // تبدیل اعداد فارسی به انگلیسی
    text = p2e(text);
    
    return text;
}

// ==============================================
// HTML Escape (مثل ربات)
// ==============================================
function htmlEscape(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ==============================================
// اعتبارسنجی کد مخفی (مثل ربات)
// ==============================================
function validateCode(text) {
    let errors = [];
    
    if ((text.match(/\|/g) || []).length % 2 !== 0) {
        errors.push("❌ تعداد | باید زوج باشد");
    }
    
    if (text.includes('||')) {
        errors.push("❌ | خالی مجاز نیست");
    }
    
    if (text.includes('__')) {
        errors.push("❌ __ مجاز نیست");
    }
    
    if (text.startsWith('_') || text.endsWith('_')) {
        errors.push("❌ _ در ابتدا یا انتها مجاز نیست");
    }
    
    if (text.includes('••')) {
        errors.push("❌ •• مجاز نیست");
    }
    
    let inBracket = false;
    let bracketContent = "";
    for (let ch of text) {
        if (ch === '|') {
            if (inBracket) {
                let tokens = bracketContent.split('_');
                for (let token of tokens) {
                    if (token && !VALID_GREEK.has(token)) {
                        errors.push(`❌ کاراکتر نامعتبر در |: ${token}`);
                    }
                }
                bracketContent = "";
                inBracket = false;
            } else {
                inBracket = true;
                bracketContent = "";
            }
        } else if (inBracket) {
            bracketContent += ch;
        }
    }
    
    let outsideBracket = text.replace(/\|[^|]*\|/g, '');
    let nums = outsideBracket.match(/\d+/g) || [];
    for (let num of nums) {
        if (parseInt(num) > 32) {
            errors.push(`❌ عدد ${num} معتبر نیست (بزرگتر از ۳۲)`);
        }
    }
    
    return errors;
}

// ==============================================
// Tokenizer (مثل ربات)
// ==============================================
function tokenize(text) {
    let tokens = [];
    let i = 0;
    
    // تشخیص ایموجی‌ها
    const emojiRegex = /[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}]/u;
    
    while (i < text.length) {
        // بررسی ایموجی
        let match = text.substring(i).match(emojiRegex);
        if (match && match.index === 0) {
            tokens.push(['EMOJI', match[0]]);
            i += match[0].length;
            continue;
        }
        
        // عدد
        if (text[i] >= '0' && text[i] <= '9') {
            let num = '';
            while (i < text.length && text[i] >= '0' && text[i] <= '9') {
                num += text[i];
                i++;
            }
            tokens.push(['NUMBER', num]);
            continue;
        }
        
        // حرف فارسی
        if (letterToNum[text[i]] || text[i] === 'آ') {
            tokens.push(['PERSIAN', text[i]]);
            i++;
            continue;
        }
        
        // جداکننده‌ها
        if (['•', '|', '_', ' '].includes(text[i])) {
            tokens.push(['SEPARATOR', text[i]]);
            i++;
            continue;
        }
        
        // بقیه کاراکترها
        tokens.push(['OTHER', text[i]]);
        i++;
    }
    
    return tokens;
}

// ==============================================
// تبدیل عدد به یونانی (مثل ربات)
// ==============================================
function convertNumberToGreek(numStr) {
    let result = [];
    for (let ch of numStr) {
        if (ch >= '0' && ch <= '9') {
            result.push(numberToGreek[ch] || ch);
        } else {
            result.push(ch);
        }
    }
    return result.join('_');
}

// ==============================================
// Encode (دقیقاً مثل ربات)
// ==============================================
function encode(text) {
    try {
        text = cleanText(text);
        let lines = text.split('\n');
        let resultLines = [];
        
        for (let line of lines) {
            if (!line.trim()) {
                resultLines.push('');
                continue;
            }
            
            let tokens = tokenize(line);
            let outputParts = [];
            let currentPart = [];
            let greekBuffer = [];
            
            for (let [tokenType, tokenValue] of tokens) {
                if (tokenType === 'PERSIAN') {
                    if (greekBuffer.length > 0) {
                        currentPart.push('|' + greekBuffer.join('_') + '|');
                        greekBuffer = [];
                    }
                    currentPart.push(letterToNum[tokenValue]);
                } else if (tokenType === 'NUMBER') {
                    greekBuffer.push(convertNumberToGreek(tokenValue));
                } else if (tokenType === 'SEPARATOR') {
                    if (tokenValue === ' ') {
                        if (greekBuffer.length > 0) {
                            currentPart.push('|' + greekBuffer.join('_') + '|');
                            greekBuffer = [];
                        }
                        if (currentPart.length > 0) {
                            outputParts.push(currentPart.join('_'));
                            currentPart = [];
                        }
                        outputParts.push('•');
                    } else {
                        if (greekBuffer.length > 0) {
                            currentPart.push('|' + greekBuffer.join('_') + '|');
                            greekBuffer = [];
                        }
                        if (currentPart.length > 0) {
                            outputParts.push(currentPart.join('_'));
                            currentPart = [];
                        }
                        outputParts.push(tokenValue);
                    }
                } else if (tokenType === 'EMOJI') {
                    if (greekBuffer.length > 0) {
                        currentPart.push('|' + greekBuffer.join('_') + '|');
                        greekBuffer = [];
                    }
                    if (currentPart.length > 0) {
                        outputParts.push(currentPart.join('_'));
                        currentPart = [];
                    }
                    outputParts.push(tokenValue);
                } else { // OTHER
                    if (greekBuffer.length > 0) {
                        currentPart.push('|' + greekBuffer.join('_') + '|');
                        greekBuffer = [];
                    }
                    if (currentPart.length > 0) {
                        outputParts.push(currentPart.join('_'));
                        currentPart = [];
                    }
                    outputParts.push(tokenValue);
                }
            }
            
            if (greekBuffer.length > 0) {
                currentPart.push('|' + greekBuffer.join('_') + '|');
                greekBuffer = [];
            }
            if (currentPart.length > 0) {
                outputParts.push(currentPart.join('_'));
            }
            
            resultLines.push(outputParts.join(''));
        }
        
        return htmlEscape(resultLines.join('\n'));
    } catch (e) {
        console.error('Encode error:', e);
        return '❌ خطا در تبدیل';
    }
}

// ==============================================
// Decode (دقیقاً مثل ربات)
// ==============================================
function decode(text) {
    try {
        text = cleanText(text);
        
        let errors = validateCode(text);
        if (errors.length > 0) {
            return htmlEscape(errors.slice(0, 3).join('\n'));
        }
        
        let lines = text.split('\n');
        let finalLines = [];
        
        for (let line of lines) {
            if (!line.trim()) {
                finalLines.push('');
                continue;
            }
            
            let tokens = tokenize(line);
            let resultWords = [];
            let currentWord = '';
            let inBracket = false;
            let bracketContent = '';
            
            for (let [tokenType, tokenValue] of tokens) {
                if (tokenType === 'SEPARATOR' && tokenValue === '|') {
                    if (inBracket) {
                        inBracket = false;
                        let greekTokens = bracketContent.split('_');
                        for (let gt of greekTokens) {
                            if (greekToNum[gt] !== undefined) {
                                currentWord += greekToNum[gt];
                            } else {
                                return htmlEscape(`❌ کاراکتر نامعتبر در |: ${gt}`);
                            }
                        }
                        bracketContent = '';
                    } else {
                        inBracket = true;
                        bracketContent = '';
                    }
                    continue;
                }
                
                if (inBracket) {
                    bracketContent += tokenValue;
                    continue;
                }
                
                if (tokenType === 'NUMBER') {
                    let num = parseInt(tokenValue);
                    if (num > 32) {
                        return htmlEscape(`❌ عدد ${num} معتبر نیست (بزرگتر از ۳۲)`);
                    }
                    if (numToLetter[tokenValue]) {
                        currentWord += numToLetter[tokenValue];
                    } else {
                        currentWord += tokenValue;
                    }
                } else if (tokenType === 'SEPARATOR') {
                    if (tokenValue === '•') {
                        if (currentWord) {
                            resultWords.push(currentWord);
                            currentWord = '';
                        }
                    }
                } else if (tokenType === 'EMOJI') {
                    if (currentWord) {
                        resultWords.push(currentWord);
                        currentWord = '';
                    }
                    resultWords.push(tokenValue);
                } else if (tokenType === 'PERSIAN') {
                    currentWord += tokenValue;
                } else { // OTHER
                    if (currentWord) {
                        resultWords.push(currentWord);
                        currentWord = '';
                    }
                    resultWords.push(tokenValue);
                }
            }
            
            if (currentWord) {
                resultWords.push(currentWord);
            }
            
            finalLines.push(resultWords.join(' '));
        }
        
        return htmlEscape(finalLines.join('\n'));
    } catch (e) {
        console.error('Decode error:', e);
        return '❌ خطا در تبدیل';
    }
}

// ==============================================
// تشخیص خودکار نوع ورودی (مثل ربات)
// ==============================================
function detectConversionType(text) {
    text = cleanText(text);
    
    if (/[ا-ی]/.test(text)) {
        return 'encode';
    }
    
    if (/^[0-9_•|α-ωοπϛΑ-ΩΟϚ]+$/.test(text)) {
        return 'decode';
    }
    
    if (/[α-ωοπϛ]/.test(text) || /[Α-ΩΟϚ]/.test(text)) {
        return 'decode';
    }
    
    if (text.includes('•') || text.includes('|')) {
        return 'decode';
    }
    
    if (text.includes('_') && /\d/.test(text)) {
        return 'decode';
    }
    
    return 'encode';
}

function createStars() {
    const container = document.getElementById('stars');

    for (let i = 0; i < count; i++) {

        star.style.setProperty('--duration', (Math.random() * 4 + 2) + 's');
        star.style.animationDelay = (Math.random() * 6) + 's';
        container.appendChild(star);
    }
}
createStars();

// ==============================================
// مودال
// ==============================================
function showModal(title, body) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').textContent = body;
    document.getElementById('modalOverlay').classList.add('show');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    document.body.style.overflow = '';
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// ==============================================
// دکمه‌ها
// ==============================================
function showAbout() {
    showModal('ℹ️ درباره ربات', 
`🤖 نسخه: 3.3.4
📅 1404/11/25

✅ تبدیل فارسی ↔ کد مخفی
✅ تشخیص خودکار
✅ پشتیبانی از اعداد یونانی (π برای عدد ۶)
✅ تاریخچه و آمار`);
}

let conversionCount = 0;
let historyLog = '';

function showStats() {
    showModal('📊 آمار من', 
`📝 تعداد تبدیل‌ها: ${conversionCount}
📆 تاریخ عضویت: ۱۴۰۴/۰۳/۱۶`);
}

function showHistory() {
    if (conversionCount === 0) {
        showModal('📜 تاریخچه', '📜 هنوز تبدیلی انجام ندادید!');
        return;
    }
    showModal('📜 تاریخچه', 
`📌 آخرین تبدیل‌ها:

${historyLog || 'هنوز تبدیلی انجام ندادید!'}`);
}

// ==============================================
// قلب‌ها و ساعت
// ==============================================
function dropHearts() {
    for (let i = 0; i < 10; i++) {
        setTimeout(() => {
            const heart = document.createElement('div');
            heart.className = 'heart-drop';
            heart.innerHTML = ['💕', '❤️', '💖', '💗', '💜', '✨'][Math.floor(Math.random() * 6)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = Math.random() * 2.5 + 2 + 's';
            heart.style.fontSize = Math.random() * 18 + 12 + 'px';
            heart.style.opacity = Math.random() * 0.5 + 0.3;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }, i * 60);
    }
}

function startClock() {
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;
        
        if (hours === minutes && minutes !== '00' && seconds === '00') {
            dropHearts();
        }
    }
    updateClock();
    setInterval(updateClock, 1000);
}
startClock();

// ==============================================
// رویدادها
// ==============================================
const inputBox = document.getElementById('inputBox');
const outputDiv = document.getElementById('outputText');
const resultBox = document.getElementById('resultBox');
let lastValue = '';
let lastResult = '';
let debounceTimer;

function vibrate() {
    if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(60);
    }
}

function showErrorToast(msg) {
    let old = document.querySelector('.toast');
    if (old) old.remove();
    let toast = document.createElement('div');
    toast.className = 'toast toast-error';
    toast.innerHTML = `❌ ${msg} ❌`;
    document.body.appendChild(toast);
    vibrate();
    inputBox.classList.add('shake');
    setTimeout(() => inputBox.classList.remove('shake'), 300);
    setTimeout(() => toast.remove(), 2500);
}

function showSuccessToast(msg) {
    let old = document.querySelector('.toast');
    if (old) old.remove();
    let toast = document.createElement('div');
    toast.className = 'toast toast-success';
    toast.innerHTML = `✅ ${msg} ✅`;
    document.body.appendChild(toast);
    vibrate();
    setTimeout(() => toast.remove(), 2500);
}

function update() {
    let rawText = inputBox.value;
    
    if (/[a-zA-Z]/.test(rawText) && !/[a-zA-Z]/.test(lastValue)) {
        showErrorToast('فقط حروف فارسی مجاز است');
        let newText = rawText.replace(/[a-zA-Z]/g, '');
        inputBox.value = newText;
        rawText = newText;
        inputBox.blur();
    }
    
    lastValue = inputBox.value;
    
    if (rawText === '') {
        outputDiv.innerText = '—';
        outputDiv.setAttribute('data-error', 'false');
        return;
    }
    
    let convType = detectConversionType(rawText);
    let result;
    
    if (convType === 'encode') {
        result = encode(rawText);
    } else {
        result = decode(rawText);
    }
    
    if (result !== lastResult && result !== '—' && !result.includes('❌')) {
        conversionCount++;
        let short = result.length > 30 ? result.slice(0, 30) + '...' : result;
        historyLog = `${conversionCount}. ${short}\n` + (historyLog || '').split('\n').slice(0, 4).join('\n');
        lastResult = result;
    }
    
    outputDiv.innerText = result;
    outputDiv.setAttribute('dir', 'ltr');
    
    if (result.includes('❌')) {
        outputDiv.setAttribute('data-error', 'true');
    } else {
        outputDiv.setAttribute('data-error', 'false');
    }
}

inputBox.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(update, 200);
});

resultBox.addEventListener('click', async function(e) {
    e.stopPropagation();
    let txt = outputDiv.innerText;
    let isErr = outputDiv.getAttribute('data-error') === 'true';
    
    if (!txt || txt === '—' || isErr || txt.includes('❌')) {
        showErrorToast('چیزی برای کپی نیست');
        return;
    }
    
    inputBox.blur();
    
    try {
        await navigator.clipboard.writeText(txt);
        showSuccessToast('کپی شد');
        resultBox.style.transform = 'scale(0.97)';
        setTimeout(() => resultBox.style.transform = '', 150);
    } catch (err) {
        try {
            const textarea = document.createElement('textarea');
            textarea.value = txt;
            textarea.style.position = 'fixed';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showSuccessToast('کپی شد');
            resultBox.style.transform = 'scale(0.97)';
            setTimeout(() => resultBox.style.transform = '', 150);
        } catch (err2) {
            showErrorToast('کپی نشد');
        }
    }
});

inputBox.value = '';
update();

function autoResizeTextarea() {
    inputBox.style.height = 'auto';
    let newHeight = Math.min(inputBox.scrollHeight, 180);
    inputBox.style.height = newHeight + 'px';
}
inputBox.addEventListener('input', autoResizeTextarea);
autoResizeTextarea();
